name: Update seismic data

on:
  schedule:
    # Runs every 5 minutes (minimum interval allowed by GitHub Actions)
    - cron: "*/5 * * * *"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch and update sismos.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch the latest commit so we can push back
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch seismic data
        run: python scripts/fetch_quakes.py

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sismos.json
          # Only commit when there are staged changes
          git diff --cached --quiet \
            || git commit -m "data: update sismos.json [skip ci]"
          git push
