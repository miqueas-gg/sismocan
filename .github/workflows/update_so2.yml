name: Update SO₂ TROPOMI

on:
  schedule:
    # Cada día a las 09:00 UTC (los productos S5P L2 suelen estar
    # disponibles con ~3 h de retardo desde la observación).
    - cron: "0 9 * * *"
  workflow_dispatch:     # permite lanzarlo manualmente desde GitHub Actions

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # necesario para hacer commit del so2.json actualizado

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openeo requests

      - name: Run fetch_so2.py
        env:
          COPERNICUS_CLIENT_ID:     ${{ secrets.COPERNICUS_CLIENT_ID }}
          COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
        run: python scripts/fetch_so2.py

      - name: Commit data/so2.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/so2.json
          if git diff --cached --quiet; then
            echo "Sin cambios en so2.json, nada que commitear."
          else
            git commit -m "chore(data): actualizar SO₂ TROPOMI [skip ci]"
            git push
          fi
